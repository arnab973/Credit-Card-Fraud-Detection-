<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.5em;
            font-weight: bold;
            display: none;
        }
        .safe {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fraud {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            display: none;
            margin-top: 20px;
            font-size: 1.2em;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Credit Card Fraud Detection</h1>

        <div class="input-group">
            <label for="time">Time</label>
            <input type="number" id="time" placeholder="Enter time (e.g., 1.0)" step="any" required>
        </div>

        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount (e.g., 100.0)" step="any" required>
        </div>

        <div class="button-group">
            <button onclick="generateFeatures()">Auto-Generate Hidden Features (V1–V28)</button>
            <button onclick="predictFraud()">Predict Fraud</button>
        </div>

        <div id="loading" class="loading">Processing...</div>

        <div id="result" class="result"></div>
    </div>

    <script>
        let features = {};

        async function generateFeatures() {
            try {
                document.getElementById('loading').style.display = 'block';
                const response = await fetch('/generate_features');
                features = await response.json();
                alert('Hidden features (V1-V28) have been auto-generated successfully!');
            } catch (error) {
                alert('Error generating features: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function predictFraud() {
            const time = parseFloat(document.getElementById('time').value);
            const amount = parseFloat(document.getElementById('amount').value);

            if (isNaN(time) || isNaN(amount)) {
                alert('Please enter valid Time and Amount.');
                return;
            }

            if (Object.keys(features).length !== 28) {
                alert('Please generate the hidden features first.');
                return;
            }

            const data = { Time: time, Amount: amount, ...features };

            try {
                document.getElementById('loading').style.display = 'block';
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                const resultDiv = document.getElementById('result');
                resultDiv.innerText = result.result;
                resultDiv.className = 'result ' + (result.result.includes('Fraud') ? 'fraud' : 'safe');
                resultDiv.style.display = 'block';
            } catch (error) {
                alert('Error predicting fraud: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
